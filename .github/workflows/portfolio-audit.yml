name: Portfolio audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read-only repository inventory
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing PORTFOLIO_GH_TOKEN secret. Add a GitHub token with repository read permissions under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("GH_TOKEN") or os.environ["GITHUB_TOKEN"]
          req = urllib.request.Request(
            "https://api.github.com/user/repos?per_page=100&affiliation=owner",
            headers={"Authorization": "Bearer " + token,
                     "Accept": "application/vnd.github+json",
                     "User-Agent": "nimoe-audit"})
          with urllib.request.urlopen(req, timeout=30) as response:
            repositories = json.load(response)
          own = [r for r in repositories if r.get("owner", {}).get("login", "").lower() == "kanak234"]
          print(json.dumps({"repository_count_first_page": len(own),
                            "repositories": [{"name": r["full_name"],
                              "private": r["private"],
                              "archived": r["archived"],
                              "stars": r["stargazers_count"]} for r in own]}, indent=2))
          print("Read-only inventory complete. Additional pages and full audit require the dedicated token and expanded workflow.")
          PY
