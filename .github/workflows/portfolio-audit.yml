name: Portfolio audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit repositories
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: Kanak234
          NEUTRON_API_KEY: ${{ secrets.API }}
          NEUTRON_API_URL: ${{ vars.NEUTRON_API_URL }}
          NEUTRON_MODEL: ${{ vars.NEUTRON_MODEL }}
        run: python scripts/audit.py
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-audit
          path: reports/
          if-no-files-found: warn
          retention-days: 30
